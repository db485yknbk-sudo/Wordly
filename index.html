<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordly - Video Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101426;
  color: white;
  text-align: center;
}

header {
  padding: 22px;
  font-size: 30px;
  font-weight: bold;
  color: #55e6c1;
}

.coins {
  background: #202944;
  padding: 12px;
  border-radius: 20px;
  display: inline-block;
  margin: 10px;
}

.container {
  padding: 20px;
  max-width: 500px;
  margin: auto;
}

video {
  width: 100%;
  height: 260px;
  background: black;
  border-radius: 18px;
  object-fit: cover;
  margin-top: 15px;
}

select, button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
}

select {
  background: #202944;
  color: white;
}

button {
  background: #55e6c1;
  color: #101426;
  font-weight: bold;
  cursor: pointer;
}

#status {
  margin-top: 15px;
  color: #55e6c1;
}
</style>
</head>

<body>

<header>🌍 WORDLY</header>

<div class="coins">
  🪙 Coins: <span id="coins">100</span>
</div>

<div class="container">

<h2>Meet New People</h2>
<p>Connect with people around the world.</p>

<select id="country">
  <option value="Morocco">🇲🇦 Morocco - FREE</option>
  <option value="France">🇫🇷 France - 10 Coins</option>
  <option value="Spain">🇪🇸 Spain - 10 Coins</option>
  <option value="Germany">🇩🇪 Germany - 10 Coins</option>
  <option value="Brazil">🇧🇷 Brazil - 10 Coins</option>
  <option value="Turkey">🇹🇷 Turkey - 10 Coins</option>
  <option value="USA">🇺🇸 USA - 20 Coins</option>
  <option value="Japan">🇯🇵 Japan - 20 Coins</option>
</select>

<video id="camera" autoplay playsinline muted></video>

<button onclick="startCamera()">🎥 Start Video Chat</button>

<p id="status">Ready to start</p>

</div>

<script>
let coins = 100;
let stream = null;

async function startCamera() {
  const status = document.getElementById("status");
  const country = document.getElementById("country").value;

  let cost = country === "Morocco" ? 0 :
             (country === "USA" || country === "Japan" ? 20 : 10);

  if (coins < cost) {
    status.textContent = "Not enough coins!";
    return;
  }

  try {
    if (!stream) {
      stream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
      });

      document.getElementById("camera").srcObject = stream;
    }

    coins -= cost;
    document.getElementById("coins").textContent = coins;
    status.textContent = "Camera ready! Selected: " + country;

  } catch (error) {
    status.textContent = "Please allow camera and microphone access.";
  }
}
</script>

</body>
</html>
