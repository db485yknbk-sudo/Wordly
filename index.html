<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordly - Meet New People</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080d1b;
  color: white;
  text-align: center;
}

header {
  padding: 22px;
  background: #101a32;
  font-size: 28px;
  font-weight: bold;
  color: #55d6ff;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

h2 {
  margin-top: 25px;
}

select, button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
}

select {
  background: #17233e;
  color: white;
}

button {
  background: #12a9e8;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.stop {
  background: #e33d55;
}

.videos {
  margin-top: 20px;
}

video {
  width: 100%;
  height: 230px;
  background: #000;
  border-radius: 15px;
  object-fit: cover;
  margin-top: 12px;
}

#status {
  margin-top: 20px;
  padding: 14px;
  background: #17233e;
  border-radius: 10px;
  color: #55d6ff;
  overflow-wrap: anywhere;
}

.small {
  color: #9aa8c5;
  font-size: 13px;
  margin-top: 20px;
}
</style>
</head>

<body>

<header>WORDLY 🌍</header>

<div class="container">

<h2>Meet People Around The World</h2>

<p>Connect with new people through random video chat.</p>

<select id="country">
  <option value="Morocco">🇲🇦 Morocco - FREE</option>
  <option value="France">🇫🇷 France</option>
  <option value="Spain">🇪🇸 Spain</option>
  <option value="Germany">🇩🇪 Germany</option>
  <option value="Brazil">🇧🇷 Brazil</option>
  <option value="Turkey">🇹🇷 Turkey</option>
  <option value="USA">🇺🇸 USA</option>
  <option value="Japan">🇯🇵 Japan</option>
</select>

<div class="videos">

  <video id="camera" autoplay muted playsinline></video>

  <video id="remoteVideo" autoplay playsinline></video>

</div>

<button id="cameraButton" onclick="startCamera()">
  Start Camera
</button>

<button id="findButton" onclick="nextUser()">
  Find Someone
</button>

<button class="stop" onclick="stopChat()">
  Stop
</button>

<div id="status">Welcome to Wordly</div>

<p class="small">
  Wordly - Meet new people, make new friends.
</p>

</div>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>

// FIREBASE CONFIG

const firebaseConfig = {
  apiKey: "AIzaSyCvx3XfMsXdYD6zrYEJ8CrUAgYOHv0Vsb4",
  authDomain: "wordly-24005.firebaseapp.com",
  projectId: "wordly-24005",
  storageBucket: "wordly-24005.firebasestorage.app",
  messagingSenderId: "131200499614",
  appId: "1:131200499614:web:ef570eb24ea0df61b7a08f",
  measurementId: "G-YPJJYLN894"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const waitingUsers = db.collection("waiting_users");

const camera = document.getElementById("camera");
const remoteVideo = document.getElementById("remoteVideo");
const statusText = document.getElementById("status");

let currentUser = null;
let localStream = null;
let peer = null;
let roomRef = null;

let waitingListener = null;
let roomListener = null;
let candidateListener = null;

let candidateIds = new Set();
let pendingCandidates = [];

let remoteDescriptionSet = false;
let matchStarting = false;
let active = false;
let role = null;


// AUTHENTICATION

auth.signInAnonymously()
.then((result) => {

  currentUser = result.user;

  statusText.innerText = "Wordly is ready!";

})
.catch((error) => {

  console.error(error);

  statusText.innerText =
    "Login error: " + error.message;

});


// CAMERA

async function startCamera() {

  try {

    if (localStream) {
      return;
    }

    localStream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    camera.srcObject = localStream;

    await camera.play();

    statusText.innerText = "Camera connected";

  } catch (error) {

    console.error(error);

    statusText.innerText =
      "Camera error: " + error.message;

  }

}


// CREATE PEER CONNECTION

function createPeerConnection() {

  peer = new RTCPeerConnection({

    iceServers: [
      {
        urls: "stun:stun.l.google.com:19302"
      },
      {
        urls: "stun:stun1.l.google.com:19302"
      }
    ]

  });

  localStream.getTracks().forEach((track) => {

    peer.addTrack(track, localStream);

  });

  peer.ontrack = (event) => {

    remoteVideo.srcObject = event.streams[0];

    remoteVideo.play().catch(console.error);

  };


  peer.onicecandidate = async (event) => {

    if (event.candidate && roomRef && role) {

      const collectionName =
        role === "offerer"
          ? "offerCandidates"
          : "answerCandidates";

      try {

        await roomRef
          .collection(collectionName)
          .add(event.candidate.toJSON());

      } catch (error) {

        console.error("ICE write error:", error);

      }

    }

  };


  peer.onconnectionstatechange = async () => {

    console.log(
      "Connection state:",
      peer.connectionState
    );

    if (peer.connectionState === "connected") {

      statusText.innerText = "Connected! 🎉";

      active = true;

      try {

        await waitingUsers
          .doc(currentUser.uid)
          .update({
            status: "matched"
          });

      } catch (error) {

        console.error(error);

      }

    }

    if (
      peer.connectionState === "failed" ||
      peer.connectionState === "disconnected"
    ) {

      statusText.innerText =
        "Connection interrupted. Try again.";

    }

  };

}


// LISTEN FOR ROOM

function listenForRoom() {

  roomListener = roomRef.onSnapshot(async (snapshot) => {

    if (!snapshot.exists) {
      return;
    }

    const data = snapshot.data();

    try {

      if (
        role === "offerer" &&
        data.answer &&
        !remoteDescriptionSet
      ) {

        await peer.setRemoteDescription(
          new RTCSessionDescription(data.answer)
        );

        remoteDescriptionSet = true;

        await processPendingCandidates();

      }


      if (
        role === "answerer" &&
        data.offer &&
        !remoteDescriptionSet
      ) {

        await peer.setRemoteDescription(
          new RTCSessionDescription(data.offer)
        );

        remoteDescriptionSet = true;

        await processPendingCandidates();

        const answer = await peer.createAnswer();

        await peer.setLocalDescription(answer);

        await roomRef.update({

          answer: {
            type: answer.type,
            sdp: answer.sdp
          }

        });

        statusText.innerText = "Connecting...";

      }

    } catch (error) {

      console.error("Room error:", error);

      statusText.innerText =
        "Room error: " + error.message;

    }

  }, (error) => {

    console.error(error);

    statusText.innerText =
      "Room listener error: " + error.message;

  });

}


// LISTEN FOR ICE CANDIDATES

function listenForCandidates() {

  const collectionName =
    role === "offerer"
      ? "answerCandidates"
      : "offerCandidates";

  candidateListener = roomRef
    .collection(collectionName)
    .onSnapshot((snapshot) => {

      snapshot.docChanges().forEach(async (change) => {

        if (change.type !== "added") {
          return;
        }

        if (candidateIds.has(change.doc.id)) {
          return;
        }

        candidateIds.add(change.doc.id);

        const candidate = new RTCIceCandidate(
          change.doc.data()
        );

        if (remoteDescriptionSet) {

          try {

            await peer.addIceCandidate(candidate);

          } catch (error) {

            console.error("Candidate error:", error);

          }

        } else {

          pendingCandidates.push(candidate);

        }

      });

    }, (error) => {

      console.error(error);

      statusText.innerText =
        "Candidate error: " + error.message;

    });

}


// PROCESS PENDING CANDIDATES

async function processPendingCandidates() {

  for (const candidate of pendingCandidates) {

    try {

      await peer.addIceCandidate(candidate);

    } catch (error) {

      console.error(error);

    }

  }

  pendingCandidates = [];

}


// START CONNECTION

async function connectToRoom(roomId, selectedRole) {

  role = selectedRole;

  roomRef = db.collection("rooms").doc(roomId);

  createPeerConnection();

  listenForRoom();

  listenForCandidates();


  if (role === "offerer") {

    const offer = await peer.createOffer();

    await peer.setLocalDescription(offer);

    await roomRef.update({

      offer: {
        type: offer.type,
        sdp: offer.sdp
      }

    });

  }

}


// FIND SOMEONE

async function nextUser() {

  if (matchStarting) {
    return;
  }

  matchStarting = true;

  try {

    if (!currentUser) {

      throw new Error("Authentication not ready. Wait a moment.");

    }

    await startCamera();

    if (!localStream) {

      throw new Error("Camera is not available.");

    }

    closeConnection();

    const country =
      document.getElementById("country").value;

    active = false;

    statusText.innerText = "Searching for people...";

    await waitingUsers
      .doc(currentUser.uid)
      .set({

        status: "waiting",
        country: country,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()

      });


    waitingListener = waitingUsers
      .where("status", "==", "waiting")
      .onSnapshot(async (snapshot) => {

        if (active || roomRef === null && peer !== null) {
          return;
        }

        const otherUser = snapshot.docs.find((doc) => {

          return (
            doc.id !== currentUser.uid &&
            doc.data().country === country
          );

        });

        if (!otherUser || roomRef) {
          return;
        }

        if (!matchStarting) {
          return;
        }

        if (waitingListener) {
          waitingListener();
          waitingListener = null;
        }

        const ids = [
          currentUser.uid,
          otherUser.id
        ].sort();

        const roomId = ids[0] + "_" + ids[1];

        const myRole =
          currentUser.uid === ids[0]
            ? "offerer"
            : "answerer";

        statusText.innerText = "Person found! Connecting...";

        try {

          if (myRole === "offerer") {

            roomRef = db.collection("rooms").doc(roomId);

            await roomRef.set({

              offererId: ids[0],
              answererId: ids[1],
              createdAt: firebase.firestore.FieldValue.serverTimestamp()

            });

            await connectToRoom(roomId, "offerer");

          } else {

            await connectToRoom(roomId, "answerer");

          }

        } catch (error) {

          console.error(error);

          statusText.innerText =
            "Connection error: " + error.message;

          matchStarting = false;

        }

      }, (error) => {

        console.error(error);

        statusText.innerText =
          "Search error: " + error.message;

        matchStarting = false;

      });

  } catch (error) {

    console.error(error);

    statusText.innerText =
      "Could not search: " + error.message;

    matchStarting = false;

  }

}


// CLOSE CONNECTION

function closeConnection() {

  if (waitingListener) {

    waitingListener();
    waitingListener = null;

  }

  if (roomListener) {

    roomListener();
    roomListener = null;

  }

  if (candidateListener) {

    candidateListener();
    candidateListener = null;

  }

  if (peer) {

    peer.close();
    peer = null;

  }

  remoteVideo.srcObject = null;

  roomRef = null;

  role = null;

  candidateIds.clear();

  pendingCandidates = [];

  remoteDescriptionSet = false;

}


// STOP CHAT

async function stopChat() {

  active = false;

  matchStarting = false;

  closeConnection();

  if (localStream) {

    localStream.getTracks().forEach((track) => {
      track.stop();
    });

    localStream = null;

  }

  camera.srcObject = null;

  if (currentUser) {

    try {

      await waitingUsers
        .doc(currentUser.uid)
        .delete();

    } catch (error) {

      console.error(error);

    }

  }

  statusText.innerText = "Chat stopped";

}


// BUTTONS

document.getElementById("findButton").addEventListener(
  "click",
  () => {
    nextUser();
  }
);

</script>

</body>
</html>
