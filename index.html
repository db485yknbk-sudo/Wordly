<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wordly - Video Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101426;
  color: white;
  text-align: center;
}

header {
  padding: 22px;
  font-size: 30px;
  font-weight: bold;
  color: #55e6c1;
}

.coins {
  background: #202944;
  padding: 12px;
  border-radius: 20px;
  display: inline-block;
  margin: 10px;
}

.container {
  padding: 20px;
  max-width: 500px;
  margin: auto;
}

video {
  width: 100%;
  height: 260px;
  background: black;
  border-radius: 18px;
  object-fit: cover;
  margin-top: 15px;
}

select, button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
}

select {
  background: #202944;
  color: white;
}

button {
  background: #55e6c1;
  color: #101426;
  font-weight: bold;
  cursor: pointer;
}

#status {
  margin-top: 15px;
  color: #55e6c1;
}
</style>
</head>

<body>

<header>🌍 WORDLY</header>

<div class="coins">
🪙 Coins: <span id="coins">100</span>
</div>

<div class="container">

<h2>Meet New People</h2>

<p>Connect with people around the world.</p>

<select id="country">
<option value="Morocco">🇲🇦 Morocco - FREE</option>
<option value="France">🇫🇷 France - 10 Coins</option>
<option value="Spain">🇪🇸 Spain - 10 Coins</option>
<option value="Germany">🇩🇪 Germany - 10 Coins</option>
<option value="Brazil">🇧🇷 Brazil - 10 Coins</option>
<option value="Turkey">🇹🇷 Turkey - 10 Coins</option>
<option value="USA">🇺🇸 USA - 20 Coins</option>
<option value="Japan">🇯🇵 Japan - 20 Coins</option>
</select>

<video id="camera" autoplay playsinline muted></video>

<video id="remoteVideo" autoplay playsinline></video>

<button onclick="startCamera()">
🎥 Start Video Chat
</button>

<button onclick="nextUser()">
⏭️ Next
</button>

<button onclick="stopCamera()">
⏹️ Stop
</button>

<p id="status">Connecting to Wordly...</p>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCvx3XfMsXdYD6zrYEJ8CrUAgYOHvV0sb4",
  authDomain: "wordly-24005.firebaseapp.com",
  projectId: "wordly-24005",
  storageBucket: "wordly-24005.firebasestorage.app",
  messagingSenderId: "131200499614",
  appId: "1:131200499614:web:ef570eb24ea0df61b7a08f"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();

const waitingUsers = db.collection("waiting_users");

let currentUser = null;

let localStream = null;

let coins = 100;

let authReady = new Promise((resolve, reject) => {

  auth.onAuthStateChanged(user => {

    if (user) {
      currentUser = user;
      document.getElementById("status").innerText =
        "Wordly connected!";
      resolve(user);
    }

  }, reject);

});

auth.signInAnonymously().catch(error => {
  console.error(error);
  document.getElementById("status").innerText =
    "Firebase login failed!";
});

async function startCamera() {

  const status = document.getElementById("status");

  try {

    await authReady;

    if (!localStream) {

      localStream =
        await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });

      document.getElementById("camera").srcObject =
        localStream;

    }

    status.innerText = "Camera ready!";

  } catch (error) {

    console.error(error);

    status.innerText =
      "Camera or Firebase error!";

  }

}

async function nextUser() {

  const status = document.getElementById("status");

  try {

    await authReady;

    if (!localStream) {
      status.innerText = "Start your camera first!";
      return;
    }

    const country =
      document.getElementById("country").value;

    await waitingUsers.doc(currentUser.uid).set({

      status: "waiting",

      country: country,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

    status.innerText =
      "Searching for people...";

  } catch (error) {

    console.error(error);

    status.innerText =
      "Could not join waiting list!";

  }

}

async function stopCamera() {

  if (localStream) {

    localStream.getTracks().forEach(track => {
      track.stop();
    });

    localStream = null;

  }

  document.getElementById("camera").srcObject = null;

  try {

    await authReady;

    await waitingUsers.doc(currentUser.uid).delete();

  } catch (error) {

    console.error(error);

  }

  document.getElementById("status").innerText =
    "Camera stopped.";

}

</script>

</body>
</html>
