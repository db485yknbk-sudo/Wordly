<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordly - Meet New People</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #090d1c;
  color: white;
  min-height: 100vh;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  color: #39d9ff;
}

.coins {
  background: #202944;
  padding: 10px 15px;
  border-radius: 25px;
  color: gold;
  font-weight: bold;
}

main {
  max-width: 450px;
  margin: auto;
  padding: 10px 20px 30px;
  text-align: center;
}

h1 {
  margin: 20px 0 10px;
  font-size: 27px;
}

.subtitle {
  color: #aab4ca;
  margin-bottom: 25px;
}

.camera {
  width: 100%;
  height: 430px;
  background: #171f35;
  border-radius: 25px;
  overflow: hidden;
  position: relative;
  border: 2px solid #273653;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.camera-text {
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  transform: translateY(-50%);
  color: #aab4ca;
  pointer-events: none;
}

select {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  background: #202944;
  color: white;
  border: 1px solid #354565;
  border-radius: 12px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 17px;
  margin-top: 15px;
  border: none;
  border-radius: 15px;
  background: linear-gradient(90deg,#00c6ff,#0072ff);
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

#status {
  margin-top: 18px;
  color: #39d9ff;
  min-height: 25px;
}

footer {
  text-align: center;
  color: #68758e;
  padding: 25px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">WORDLY</div>
  <div class="coins">🪙 <span id="coins">100</span></div>
</header>

<main>

<h1>Meet the World 🌍</h1>
<p class="subtitle">Discover new people through video chat</p>

<div class="camera">
  <video id="video" autoplay playsinline muted></video>
  <div class="camera-text" id="cameraText">
    📷 Your camera will appear here
  </div>
</div>

<select id="country">
  <option value="Morocco">🇲
